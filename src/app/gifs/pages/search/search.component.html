<!-- titulo y subtitulo del search -->
<h2 class="text-2xl font-bold mt-5">Buscar Gifs</h2>
<h3 class="text-sm text-gray-500">
  Buscar gifs por nombre, descripcion o tags
</h3>

<!-- seccion del input del search -->
<section class="flex flex-col gap-4">
  <input
    type="text"
    placeholder="Buscar Gifs"
    class="mt-3 border border-gray-300 rounded-md p-2"
    (keyup.enter)="onSearch(txtSearch.value)"
    #txtSearch
  />
</section>

<!-- seccion del resultado de las busquedas del search -->
<section class="">
  <!-- se accede mediante el servicio al array de trendingGifs -->
  <gif-list [gifs]="[]" />
</section>
