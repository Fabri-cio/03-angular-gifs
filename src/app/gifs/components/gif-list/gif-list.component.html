<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 p-5">
  <!-- puede ser item o cualquier otro nombre gifs es el input por donde recibimos la lista de gifs() -->
  @for (item of gifs(); track item) {
    <!-- enviamos a imageUrl los item -->
    <gif-list-item [imageUrl]="item" />
  }
</div>
